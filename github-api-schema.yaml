openapi: 3.1.0
info:
  title: GitHub Repository Manager
  description: API for managing GitHub repositories, commits, and code through ChatGPT
  version: 1.0.0
servers:
  - url: https://api.github.com
    description: GitHub API v3
paths:
  /user/repos:
    post:
      operationId: createRepository
      summary: Create a new repository
      description: Creates a new repository for the authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Repository name
                description:
                  type: string
                  description: Repository description
                private:
                  type: boolean
                  default: false
                  description: Whether the repository is private
                auto_init:
                  type: boolean
                  default: true
                  description: Initialize with README
      responses:
        '201':
          description: Repository created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  html_url:
                    type: string
                  name:
                    type: string
                  full_name:
                    type: string
  /repos/{owner}/{repo}/contents/{path}:
    put:
      operationId: createOrUpdateFile
      summary: Create or update a file
      description: Creates or updates a file in a repository
      security:
        - BearerAuth: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
          description: Repository owner (username or organization)
        - name: repo
          in: path
          required: true
          schema:
            type: string
          description: Repository name
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: File path in the repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - content
              properties:
                message:
                  type: string
                  description: Commit message
                content:
                  type: string
                  description: Base64 encoded file content
                branch:
                  type: string
                  default: main
                  description: Branch name
                sha:
                  type: string
                  description: Blob SHA of the file being replaced (required for updates)
      responses:
        '201':
          description: File created successfully
        '200':
          description: File updated successfully
    get:
      operationId: getFileContent
      summary: Get file content
      description: Gets the contents of a file in a repository
      security:
        - BearerAuth: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: path
          required: true
          schema:
            type: string
        - name: ref
          in: query
          schema:
            type: string
          description: Branch, tag, or commit to fetch from
      responses:
        '200':
          description: File content retrieved
  /repos/{owner}/{repo}/git/refs:
    post:
      operationId: createBranch
      summary: Create a new branch
      description: Creates a new reference (branch) in a repository
      security:
        - BearerAuth: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ref
                - sha
              properties:
                ref:
                  type: string
                  description: The name of the fully qualified reference (e.g., refs/heads/feature-branch)
                sha:
                  type: string
                  description: The SHA1 value to set this reference to
      responses:
        '201':
          description: Branch created successfully
  /repos/{owner}/{repo}:
    get:
      operationId: getRepository
      summary: Get repository details
      description: Gets information about a repository
      security:
        - BearerAuth: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Repository information retrieved
  /repos/{owner}/{repo}/commits:
    get:
      operationId: listCommits
      summary: List repository commits
      description: Lists commits for a repository
      security:
        - BearerAuth: []
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: sha
          in: query
          schema:
            type: string
          description: Branch or commit SHA to start from
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
          description: Results per page
      responses:
        '200':
          description: List of commits
  /user:
    get:
      operationId: getAuthenticatedUser
      summary: Get authenticated user
      description: Gets information about the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  login:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: GitHub Personal Access Token
